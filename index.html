<style>
/* 和紙の札：淡い若草の地に、生成りの札。つないだ言葉は朱色 */
:root{
  --bg:#e6eddc; --paper:#fffdf7; --ink:#26323a; --ink2:#5f6f78; --line:#26323a22;
  --land:#f6f0e1; --edge:#8a8170; --sea:#cfe1ea; --route:#d2492f; --route2:#9b3220; --go:#2f8a5b; --goal:#d2492f; --nb:#ffe7a3; --gold:#d79b2c;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--route)}.dots i.done{background:var(--ink)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--route);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--route2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--route2)}
button.main.alt{background:#2f5d7a;box-shadow:0 4px 0 #1d3d52}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--route2);display:inline-flex;align-items:center;min-height:44px}
/* 言葉の札 */
.goal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.goal .w{display:flex;flex-direction:column;gap:2px}
.goal .w small{font-size:12px;color:var(--ink2)}
.goal .w b{font-size:20px}
.goal .w span{font-size:13px;color:var(--ink2)}
.goal .from{color:var(--go)}.goal .to{color:var(--route2);text-align:right}
.goal em{font-style:normal;background:#ffe7a3;color:var(--ink);border-radius:4px;padding:0 3px;font-weight:800}
.trip{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;line-height:1.5;min-height:28px}
.trip b{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 6px;font-weight:800}
.trip b small{font-weight:500;color:var(--ink2);font-size:11px;margin-left:2px}
.trip b.s{border-color:var(--go);color:var(--go)}
.trip b.c{border-color:var(--route);color:var(--route2)}
.trip i{font-style:normal;color:var(--ink2)}
.ask{text-align:center;font-size:16px;font-weight:800;margin:0}
.ask em{font-style:normal;font-size:26px;color:var(--route2);background:var(--paper);border:2px solid var(--route);border-radius:10px;padding:0 10px;margin:0 4px;display:inline-block}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hand button{all:unset;box-sizing:border-box;cursor:pointer;min-height:58px;border-radius:14px;background:var(--paper);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:19px;text-align:center;padding:4px;line-height:1.25;box-shadow:0 3px 0 #26323a18}
.hand button small{font-size:12px;color:var(--ink2);font-weight:500}
.hand button small u{text-decoration:none;color:var(--ink);font-weight:800;background:#26323a12;border-radius:3px;padding:0 1px}
.hand button.ok{border-color:#e9c46a;background:#fffaf0}
.hand button.hint{background:#ffe7a3;border-color:var(--gold)}
.hand button.used{opacity:.3;cursor:default;box-shadow:none}
.hand.win button:not(.used){opacity:.5}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid #2f5d7a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #26323a1c;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:22px;font-weight:800}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:#26323a26}
/* ホーム */
.title{font-weight:800;font-size:36px;letter-spacing:.06em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--route2)}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:24px;text-align:center;margin:0}
.res{display:flex;flex-direction:column;gap:6px}
.res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 言葉帳 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;min-height:44px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.dex div small{font-size:11px;color:var(--ink2)}
.dex .no{opacity:.45}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--route2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="howto" aria-labelledby="howto-t">
  <h2 id="howto-t">遊び方</h2>
  <ol>
    <li>出発の言葉の最後の字で始まる札を、下の手札から選びます。</li>
    <li>しりとりでつないでいき、目的の言葉の最初の字にたどり着いたら到着です。</li>
    <li>いちばん少ない枚数で着けば★3つ。「ひとつ戻る」で戻れますが、出した回数は減りません。</li>
  </ol>
  <p>小さい字は大きい字に（「ゃ」は「や」）、最後が「ー」なら、その前の字でつなぎます。濁った字はそのまま（「が」と「か」は別）。</p>
  <p>今日の3問はだれでも同じで1日1回。時間制限はありません。</p>
  <p><a id="fb2" target="_blank" rel="noopener">感想を送る</a></p>
  <button class="main" id="howto-ok" style="width:100%">わかった</button>
</dialog>
<script src="words.js"></script>
<script src="gen.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/shiritori-saitan/";
const FEEDBACK = "https://github.com/satou-aaaaa/shiritori-saitan/issues/new?template=feedback.yml";
const KEY = "shiritori-v1", EPOCH = "2026-11-04";
const T = window.SHR, W = T.W;

// ---- 日付と種（日本時間。だれでも同じ3問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const lvOf = (lv) => (lv === 3 ? T.HARD : T.LV[lv]);
// 今日の3問：ひと息・ふた息・ながい道。上級：5枚つなぐ2問（光らない・ヒントなし）
const dailyList = (k) => T.LV.map((L, i) => ({ seed: T.seedOf(k + ":d:" + i), lv: i }));
const hardList = (k) => [0, 1].map((i) => ({ seed: T.seedOf(k + ":h:" + i), lv: 3 }));
const cache = new Map();
const probOf = (it) => { const k = it.seed + ":" + it.lv; if (!cache.has(k)) cache.set(k, T.make(it.seed, lvOf(it.lv))); return cache.get(k); };
// ★：最短で着けば3、2枚まで多いと2、それより多いと1。ヒント1回ごとに1つ減る（最低1）
const starsOf = (r) => Math.max(1, (r.m === r.d ? 3 : r.m - r.d <= 2 ? 2 : 1) - (r.h || 0));
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// 進行中の遊びはモードごとに分けて持つ（練習を始めても今日・上級の途中経過を消さない）。seen：言葉のよみ → 使った回数
const fresh = () => ({ v: 1, days: {}, hdays: {}, seen: {}, trips: 0, runs: {}, tut: false, kofi: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
// 保存に失敗したあとはメモリと保存の両方を読む。記録（日ごとの結果・言葉帳）は合わせて数は高いほう、途中経過は同じ日・同じ問題なら進んだほう
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ r: r.res.map((x) => ({ m: x.m, d: x.d, h: x.h })) });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? (r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null) : null; if (!b || b[r.date]) return false; b[r.date] = recOf(r); return true; }
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1e6 + (r.cur && r.cur.moves ? r.cur.moves : 0), idOf = (r) => JSON.stringify([r.list || null, r.id || null]); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; } if (!x || !y) continue; if (x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; } else if (idOf(x) === idOf(y)) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; } } return s; }
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const RANKS = [[0, "言葉のたまご"], [10, "しりとり好き"], [40, "言葉つなぎ"], [120, "しりとり名人"], [300, "言葉の達人"]];
const rankOf = (n) => RANKS.filter((r) => n >= r[0]).pop()[1];
const nextRank = (n) => RANKS.find((r) => r[0] > n);

// ---- 画面 ----
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const buzz = (n = 12) => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const footer = () => `<footer><a href="#" id="f-how">遊び方</a><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a><a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi で応援</a></footer>`;
function bindFooter() { const h = $("f-how"); if (h) h.onclick = (e) => { e.preventDefault(); openHow(); }; }
function openHow() { $("fb2").href = FEEDBACK; const d = $("howto"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
$("howto-ok").onclick = () => { const d = $("howto"); d.close ? d.close() : d.removeAttribute("open"); save((s) => { s.tut = true; }); };
const disp = (i) => W[i][0], yomi = (i) => W[i][1];
// よみの最初・最後の字に印を付ける
const yomiMark = (i, first, last) => { const r = yomi(i); let a = 0, b = r.length - 1; while (b > 0 && r[b] === "ー") b--; return [...r].map((ch, j) => (first && j === a) || (last && j === b) ? `<em>${ch}</em>` : ch).join(""); };
const lastOf = (path, p) => T.tail(yomi(path.length ? path[path.length - 1] : p.s));

function home() {
  const s = load(), k = todayKey(), done = s.days[k], hdone = s.hdays[k];
  for (const m of ["d", "h"]) { const r = s.runs[m]; if (r && r.res.length >= r.list.length) { MODE = m; return finish(); } }
  const nr = nextRank(s.trips);
  const rd = s.runs.d && s.runs.d.date === k ? s.runs.d : null, rh = s.runs.h && s.runs.h.date === k ? s.runs.h : null;
  app.innerHTML = `
    <h1 class="title">しりとり最短</h1>
    <div class="trip" aria-hidden="true" style="justify-content:center"><b class="s">すいか</b><i>→</i><b>かめ</b><i>→</i><b>めがね</b><i>→</i><b class="c">ねこ</b></div>
    <p class="lead">手札の言葉だけで、目的の言葉までしりとり。<br>いちばん少ない枚数でつなげる？　だれでも同じ1日3問。</p>
    ${done ? `<div class="share">今日の結果　${done.r.map(sq).join("")}</div>` : ""}
    <button class="main" id="go-d">${done ? "今日の結果を見る" : rd ? `続きから（${rd.res.length + 1}問目）` : `今日の3問をつなぐ <small>#${dayNo(k)}</small>`}</button>
    ${done ? `<button class="main alt" id="go-h">${hdone ? "上級の結果を見る" : rh ? "上級の続きから" : "上級：5枚つなぐ2問（ヒントなし）"}</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習（何度でも）</button><button class="sub" id="go-dex">言葉帳 ${Object.keys(s.seen).length}語</button></div>
    <div class="stats"><div><b>${streak(s.days)}</b><small>連続の日</small></div><div><b>${Object.keys(s.days).length}</b><small>遊んだ日</small></div><div><b>${s.trips}</b><small>つないだ問題</small></div></div>
    <p class="rank">称号：${rankOf(s.trips)}${nr ? `（あと${nr[0] - s.trips}問で${nr[1]}）` : ""}</p>
    ${footer()}`;
  $("go-d").onclick = () => (k !== todayKey() ? home() : done ? result("d", k) : startRun("d")); // 画面を開いたまま0時を過ぎたら、今日の状態に描き直す
  if ($("go-h")) $("go-h").onclick = () => (hdone ? result("h", k) : k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  bindFooter();
  if (!s.tut) openHow();
}
function practiceMenu() {
  app.innerHTML = `<header><button class="icon" id="back" aria-label="もどる">←</button><h1>練習<small>今日の記録には入りません（言葉帳には載ります）</small></h1><span></span></header>
    <p class="note">種類を選ぶと、新しい問題が出ます。</p>
    <div class="lv">${[...T.LV, T.HARD].map((L, i) => `<button class="sub" data-lv="${i}" style="min-height:64px">${L.name}<br><small>${L.len}枚つなぐ・手札${L.hand}枚</small></button>`).join("")}</div>${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll(".lv button").forEach((b) => (b.onclick = () => startRun("p", +b.dataset.lv)));
  bindFooter();
}
function startRun(mode, opt) {
  const k = todayKey();
  save((s) => {
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない（ホームに戻る）
    const list = mode === "d" ? dailyList(k) : mode === "h" ? hardList(k) : [{ seed: Math.floor(Math.random() * 2 ** 31), lv: opt }];
    s.runs[mode] = { mode, date: k, list, res: [], cur: null, id: Date.now().toString(36) };
  });
  MODE = mode;
  play();
}

// 今の問題：{ i, date, id, p, path:[出した札], moves, hints, hint, done, hard }
let cur = null;
function play() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  const i = run.res.length;
  if (i >= run.list.length) return finish();
  const it = run.list[i], p = probOf(it), hard = it.lv === 3;
  if (!p) { toast("問題を作れませんでした"); return home(); }
  const saved = run.cur && run.cur.i === i ? run.cur : { path: [], moves: 0, hints: 0 };
  const ok = valid(p, saved.path) && saved.moves >= saved.path.length;
  cur = { i, date: run.date, id: run.id, it, p, path: ok ? saved.path.slice() : [], moves: ok ? saved.moves : 0, hints: ok ? saved.hints || 0 : 0, hint: null, done: false, hard };
  const label = run.mode === "h" ? "上級" : run.mode === "p" ? `練習・${p.lv}` : p.lv;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      <div class="dots" aria-label="${i + 1}問目／${run.list.length}問">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div>
      <span style="font-size:13px;color:var(--ink2)">${label} ${i + 1}/${run.list.length}</span></header>
    <div class="goal"><div class="w from"><small>出発</small><b>${esc(disp(p.s))}</b><span>${yomiMark(p.s, false, true)}</span></div><span>→</span><div class="w to"><small>目的</small><b>${esc(disp(p.g))}</b><span>${yomiMark(p.g, true, false)}</span></div></div>
    <div class="trip" id="trip"></div>
    <p class="ask" id="ask"></p>
    <div class="hand" id="hand"></div>
    <div class="status"><span id="left"></span>${hard ? "<span>ヒントなし</span>" : `<button class="sub" id="hint" style="min-height:44px;padding:0 14px">ヒント</button>`}</div>
    <div class="row"><button class="sub" id="undo">ひとつ戻る</button></div>
    <div id="after"></div>`;
  $("back").onclick = home;
  $("undo").onclick = undo;
  if ($("hint")) $("hint").onclick = hint;
  paint();
  window.scrollTo(0, 0);
}
// 保存してあった札の並びが、この問題で正しいか（手札の札を1回ずつ、しりとりがつながる）
function valid(p, path) {
  if (!Array.isArray(path)) return false;
  let last = T.tail(yomi(p.s)); const goal = T.head(yomi(p.g));
  for (let j = 0; j < path.length; j++) { const h = path[j]; if (!p.hand.includes(h) || path.indexOf(h) !== j || T.head(yomi(h)) !== last || last === goal) return false; last = T.tail(yomi(h)); }
  return true;
}
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i;
// 同じ問題で保存済みの道のほうが先なら、古いタブの道で上書きしない
function keep() { save((s) => { const r = s.runs[MODE]; if (same(r) && !(r.cur && r.cur.i === cur.i && r.cur.moves > cur.moves)) r.cur = { i: cur.i, path: cur.path, moves: cur.moves, hints: cur.hints }; }); }
function paint() {
  const p = cur.p, last = lastOf(cur.path, p), goal = T.head(yomi(p.g));
  const chain = [`<b class="s">${esc(disp(p.s))}</b>`, ...cur.path.map((h, n) => `<b class="${n === cur.path.length - 1 && !cur.done ? "c" : ""}">${esc(disp(h))}</b>`), ...(cur.done ? [`<b class="c">${esc(disp(p.g))}</b>`] : [])];
  $("trip").innerHTML = chain.join("<i>→</i>");
  $("ask").innerHTML = cur.done ? "" : `<em>${last}</em>で始まる札を出す<br><small style="font-weight:500;color:var(--ink2);font-size:13px">目的は「${goal}」で始まる${esc(disp(p.g))}</small>`;
  $("hand").classList.toggle("win", cur.done);
  $("hand").innerHTML = p.hand.map((h) => { const used = cur.path.includes(h), ok = !used && !cur.hard && T.head(yomi(h)) === last; return `<button data-h="${h}" class="${used ? "used" : ""}${ok && !cur.done ? " ok" : ""}${h === cur.hint ? " hint" : ""}" ${used || cur.done ? "disabled" : ""} aria-label="${esc(disp(h))}（${yomi(h)}）">${esc(disp(h))}<small>${yomiMark(h, true, true).replace(/<em>/g, "<u>").replace(/<\/em>/g, "</u>")}</small></button>`; }).join("");
  $("hand").querySelectorAll("button[data-h]").forEach((b) => (b.onclick = () => put(+b.dataset.h)));
  $("left").textContent = cur.done ? "" : `出した回数 ${cur.moves}${cur.hints ? `・ヒント ${cur.hints}` : ""}`;
  $("undo").disabled = cur.done || !cur.path.length;
  if ($("hint")) $("hint").disabled = cur.done || cur.hints >= 2;
}
function put(h) {
  if (cur.done || cur.path.includes(h)) return;
  const last = lastOf(cur.path, cur.p);
  if (T.head(yomi(h)) !== last) { toast(`「${last}」で始まる札を出してください`); buzz(30); return; }
  cur.path.push(h); cur.moves++; cur.hint = null; buzz(); keep();
  if (T.tail(yomi(h)) === T.head(yomi(cur.p.g))) return arrive();
  paint();
  // つなげる札が手札に無いときは知らせる
  const nx = lastOf(cur.path, cur.p);
  if (!cur.p.hand.some((x) => !cur.path.includes(x) && T.head(yomi(x)) === nx)) toast(`「${nx}」で始まる札がありません。ひとつ戻ろう`);
}
function undo() { if (cur.done || !cur.path.length) return; cur.path.pop(); cur.hint = null; keep(); paint(); }
// ヒント：いまの字で始まり、目的にいちばん早く着ける札を光らせる（行き止まりなら戻るように知らせる）
function hint() {
  if (cur.done || cur.hard || cur.hints >= 2) return;
  const avail = cur.p.hand.filter((x) => !cur.path.includes(x)), b = T.best(lastOf(cur.path, cur.p), cur.p.g, avail);
  if (b == null) { toast("この先はつながりません。ひとつ戻ろう"); return; }
  cur.hint = b; cur.hints++; keep(); paint(); toast(`次は「${disp(b)}」`);
}
function arrive() {
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.done = true; buzz([10, 40, 10]);
  const p = cur.p, rec = { m: cur.moves, d: p.d, h: cur.hints }, st = starsOf(rec);
  let saved = false;
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; saved = true; r.res.push(rec); r.cur = null; s.trips++; for (const h of [p.s, ...cur.path, p.g]) s.seen[yomi(h)] = (s.seen[yomi(h)] || 0) + 1; });
  if (!saved) { toast("別の画面で先に進んでいます"); return play(); }
  paint();
  const r = s.runs[MODE], fin = r && r.res.length >= r.list.length;
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">つながった！ ${starStr(st)}</div>
    <p class="note">${cur.moves === p.d ? `最短の${p.d}枚でつなぎました。` : `${cur.moves}回出して着きました（最短は${p.d}枚）。`}${p.ways > 1 ? `最短のつなぎ方は${p.ways}通り。` : "最短のつなぎ方は1通りだけ。"}<br>例：${[p.s, ...p.chain, p.g].map((x) => esc(disp(x))).join("→")}</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  let first = false;
  const rec = { r: run.res.map((r) => ({ m: r.m, d: r.d, h: r.h })) };
  save((s2) => {
    first = bank(s2, run);
    // 別のタブで同じモードの新しい回が始まっていたら、それは消さない
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec });
  result(run.mode, run.date, first);
}
// 共有の文：言葉（答え）は出さない。最短🟩・2枚まで多い🟨・それ以上🟧、ヒントを使ったら💡
const sq = (r) => (r.h ? "💡" : r.m === r.d ? "🟩" : r.m - r.d <= 2 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  const all = rec.r.every((r) => r.m === r.d && !r.h);
  return `しりとり最短${mode === "h" ? " 上級" : ""} #${dayNo(k)} ${md(k)}\n${rec.r.map(sq).join("")}${all ? " 全部最短" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" ? dailyList(k) : hardList(k);
  const rec = mode === "p" ? prec : (mode === "d" ? s.days : s.hdays)[k];
  if (!rec) return home();
  const all = rec.r.every((r) => r.m === r.d && !r.h), text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && all && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>しりとり最短<small>${mode === "d" ? `今日の3問 #${dayNo(k)}` : mode === "h" ? "上級" : "練習"}</small></h1><span></span></header>
    <p class="big">${all ? "全部、最短でつないだ！" : `${list.length}問 つないだ`}</p>
    <div class="res">${list.map((it, j) => { const p = probOf(it), r = rec.r[j]; return `<div><span>${esc(disp(p.s))} → ${esc(disp(p.g))}<br><small style="color:var(--ink2)">${r.m}回（最短${r.d}枚）${r.h ? `・ヒント${r.h}` : ""}</small></span>${starStr(starsOf(r))}</div>`; }).join("")}</div>
    ${mode !== "p" ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩最短　🟨2枚まで多い　🟧もっと多い　💡ヒント<br>次の3問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：5枚つなぐ2問に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">言葉帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if (mode !== "p") {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

// 言葉帳：使った言葉を、最初の字ごとに数える
const ROWS = "あいうえおかきくけこがぎぐげごさしすせそざじずぜぞたちつてとだぢづでどなにぬねのはひふへほばびぶべぼぱぴぷぺぽまみむめもやゆよらりるれろわ";
function dex() {
  const s = load(), got = Object.keys(s.seen), by = {}; for (const r of got) { const h = T.head(r); by[h] = (by[h] || 0) + 1; }
  const all = {}; for (const w of W) { const h = T.head(w[1]); all[h] = (all[h] || 0) + 1; }
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>言葉帳<small>${got.length}/${W.length}語・つないだ問題 ${s.trips}</small></h1><span></span></header>
    <p class="note">出発・目的・出した札の言葉が集まります。最初の字ごとの数です。</p>
    <div class="dex">${[...ROWS].filter((h) => all[h]).map((h) => `<div class="${by[h] ? "" : "no"}">${h}<small>${by[h] || 0}/${all[h]}</small></div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

window.__sh = { mode: () => MODE, T, dailyList, hardList, probOf, starsOf, todayKey, dayNo, shareText, streak, load, valid, cur: () => cur, put: (h) => put(h), play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
